version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Bronze — append-only raw history
#
# Tables are created by Terraform (infra/bigquery.tf) and written only by ingest
# jobs (ingest/<source>-<entity>/). dbt reads them as sources and never writes
# to them. Each ingest run appends what it saw; silver decides which version
# of a record to use.
#
# Freshness: `dbt source freshness` (run after `dbt build` in the transform
# job) fails the run when a table hasn't been written for longer than its ingest
# schedule allows — i.e. when an ingest job has stopped working.
# ══════════════════════════════════════════════════════════════════════════════

sources:
  - name: bronze
    schema: bronze
    config:
      loaded_at_field: ingested_at

    tables:
      - name: openmeteo_forecast
        description: >
          Open-Meteo hourly forecasts, one point per ISO-NE load zone, in source
          (metric) units. Every run is kept: hours ahead are what was forecast
          at ingested_at; past hours are the model's best estimate.
          Grain: load zone × hour × ingest run.
        config:
          freshness:
            # Every 6 hours; the slack covers one failed run
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}

      - name: isone_fuel_mix
        description: >
          ISO-NE generation by fuel: snapshots every few minutes at irregular
          times, MW per fuel running (a fuel not running is absent, not 0).
          Each run re-pulls yesterday and today (decision 0010).
          Grain: snapshot × fuel × ingest run.
        config:
          freshness:
            # Every 6 hours; the slack covers one failed run
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}

      - name: isone_system_load
        description: >
          ISO-NE five-minute system load, with ISO-NE's behind-the-meter
          (rooftop) solar estimate. Each run re-pulls yesterday and today
          (decision 0010). Grain: five-minute interval × ingest run.
        config:
          freshness:
            # Every 6 hours; the slack covers one failed run
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}

      - name: isone_zonal_load
        description: >
          ISO-NE five-minute estimated load per load zone, with each zone's
          rooftop solar estimate. Each run re-pulls yesterday and today
          (decision 0010). Grain: five-minute interval × load zone × ingest run.
        config:
          freshness:
            # Every 6 hours; the slack covers one failed run
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}

      - name: isone_rt_lmp
        description: >
          ISO-NE five-minute real-time prices at the Hub and eight load zones:
          preliminary for yesterday and today, final for 2–3 days ago, labelled
          by LmpType (decision 0012). Grain: five-minute interval × location ×
          version × ingest run.
        config:
          freshness:
            # Every 6 hours; the slack covers one failed run
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}

      - name: isone_da_lmp
        description: >
          ISO-NE hourly day-ahead prices at the Hub and eight load zones, today
          and tomorrow each run (decision 0012). Grain: hour × location × ingest
          run.
        config:
          freshness:
            # Every 6 hours; the slack covers one failed run
            warn_after: {count: 7, period: hour}
            error_after: {count: 13, period: hour}

      - name: isone_rt_lmp_hourly
        description: >
          ISO-NE hourly real-time prices (final) at the Hub and eight load zones,
          2019–2024: a one-off backfill of the years before the five-minute
          history (decision 0013). No freshness check: nothing writes it on a
          schedule. Grain: hour × location × ingest run.

      - name: eia_region_data
        description: >
          EIA-930 hourly demand, day-ahead demand forecast, net generation and
          interchange for ISO New England, from the API, 2019 on (decision 0014).
          Hours labelled by their end. Grain: hour × measure × ingest run.
        config:
          freshness:
            # Daily; the slack covers one failed run
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}

      - name: eia_region_data_bulk
        description: >
          The same measures for 2015-07 to 2018-12, from EIA's bulk files in the
          API's shape: a one-off backfill (decision 0014). No freshness check.
          Grain: hour × measure × ingest run.

      - name: eia_fuel_type_data
        description: >
          EIA-930 hourly net generation by fuel for ISO New England, from the
          API, 2019 on (decision 0014). Hours labelled by their end. Grain: hour
          × fuel × ingest run.
        config:
          freshness:
            # Daily; the slack covers one failed run
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
