version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Silver — every model is <bronze table>__<step>, so each source's models
# sort together and the name says what the model is (decision 0007)
#
#   __base     the cleaned copy: renamed, typed, converted, no business rules.
#              A view. For most sources it's the latest version of each record;
#              for forecasts every version is a record (decision 0009).
#   __<step>   one step, named for what it produces, built from __base or
#              earlier steps. Views, unless they sit on a growing bronze table:
#              those are incremental tables (decision 0003).
#
# Tests run in `dbt build` before gold is rebuilt; an error-severity failure
# skips everything downstream, so bad data never reaches gold. Tests go on
# tables, not on views over all of bronze, so they don't rescan it every run.
#   unique_combination / not_null  → the model's grain holds
#   accepted_values                → keys join cleanly across sources
#   accepted_range                 → values are physically plausible
# ══════════════════════════════════════════════════════════════════════════════

models:

  # ── Weather ─────────────────────────────────────────────────────────────────

  - name: openmeteo_forecast__base
    description: >
      Every Open-Meteo forecast run, one row per load zone × hour × run, in grid
      units. No tests: they would scan all of bronze (see header).
    columns:
      - name: load_zone
        description: ISO-NE load zone the weather point represents.
      - name: hour_at
        description: Hour the values are for (UTC). Precipitation, snowfall, and irradiance cover the hour ending here.
      - name: lead_hours
        description: Hours from the ingest run to hour_at; ≤ 0 means a best estimate after the fact, not a forecast.
      - name: ingested_at
        description: The ingest run (UTC), effectively when the forecast was issued.

  - name: openmeteo_forecast__latest
    description: >
      The newest value for each load zone × hour: best estimate for past hours,
      latest forecast for future ones. Incremental table (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [load_zone, hour_at]
    columns:
      - name: load_zone
        description: ISO-NE load zone the weather point represents.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ME, NH, VT, CT, RI, SEMA, WCMA, NEMA]
      - name: location_name
        description: City the point is placed at.
      - name: hour_at
        description: Hour the values are for (UTC).
        data_tests: [not_null]
      - name: lead_hours
        description: Hours from the newest run to hour_at; ≤ 0 means a best estimate after the fact.
      - name: temperature_f
        description: Air temperature at 2 m, °F.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -50
                max_value: 120
      - name: dew_point_f
        description: Dew point at 2 m, °F.
      - name: cloud_cover_pct
        description: Total cloud cover, %.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: solar_irradiance_w_m2
        description: Global horizontal irradiance, W/m², mean over the hour ending at hour_at.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 1400
      - name: wind_speed_10m_ms
        description: Wind speed at 10 m, m/s.
      - name: wind_speed_100m_ms
        description: Wind speed at 100 m (turbine hub height), m/s.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: precipitation_mm
        description: Total precipitation over the hour ending at hour_at, mm.
      - name: snowfall_cm
        description: Snowfall over the hour ending at hour_at, cm.
      - name: ingested_at
        description: The ingest run this hour's values came from (UTC).
        data_tests: [not_null]

  # ── ISO-NE: generation by fuel ──────────────────────────────────────────────

  - name: isone_fuel_mix__base
    description: >
      Every ISO-NE fuel mix snapshot, one row per snapshot × fuel × ingest run.
      Fuels not running are absent, not 0. No tests: they would scan all of
      bronze (see header).
    columns:
      - name: snapshot_at
        description: When ISO-NE took the snapshot (UTC); irregular, ~200 a day.
      - name: fuel
        description: Fuel (ISO-NE's FuelCategory), e.g. Natural Gas, Nuclear, Wind.
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: isone_fuel_mix__latest
    description: >
      The newest version of each snapshot × fuel: MW per fuel running, and
      which fuel was marginal. Incremental table (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_at, fuel]
    columns:
      - name: snapshot_at
        description: When ISO-NE took the snapshot (UTC).
        data_tests: [not_null]
      - name: fuel
        description: Fuel (ISO-NE's FuelCategory), e.g. Natural Gas, Nuclear, Hydro, Wind, Solar, Oil, Batteries.
        data_tests: [not_null]
      - name: fuel_group
        description: ISO-NE's grouping (FuelCategoryRollup); wind, solar, wood, refuse and landfill gas are Renewables.
      - name: generation_mw
        description: Generation from this fuel at snapshot_at, MW.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -5000  # storage can draw power; room for it to show as negative
                max_value: 30000
      - name: is_marginal
        description: Whether this fuel was setting the real-time price at snapshot_at.
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

  # ── ISO-NE: system load ─────────────────────────────────────────────────────

  - name: isone_system_load__base
    description: >
      Every ISO-NE five-minute system load interval, one row per interval ×
      ingest run, with the rooftop solar estimate broken out. No tests: they
      would scan all of bronze (see header).
    columns:
      - name: interval_start_at
        description: Start of the five-minute interval (UTC).
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: isone_system_load__latest
    description: >
      The newest version of each five-minute interval's load, measured and with
      rooftop solar added back. Incremental table (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [interval_start_at]
    columns:
      - name: interval_start_at
        description: Start of the five-minute interval (UTC).
        data_tests: [not_null]
      - name: load_mw
        description: ISO-NE system load (what the grid served), MW.
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 40000
      - name: native_load_mw
        description: load_mw less asset-related demand, MW.
      - name: asset_related_demand_mw
        description: Pumped storage pumping and batteries charging, MW.
      - name: load_with_btm_solar_mw
        description: load_mw plus ISO-NE's rooftop solar estimate, MW; the demand weather drives.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 40000
      - name: native_load_with_btm_solar_mw
        description: native_load_mw plus ISO-NE's rooftop solar estimate, MW.
      - name: btm_solar_mw
        description: ISO-NE's behind-the-meter (rooftop) solar estimate, MW; 0 after dark.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 15000
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

  # ── ISO-NE: zonal load ──────────────────────────────────────────────────────

  - name: isone_zonal_load__base
    description: >
      Every ISO-NE zonal load interval, one row per interval × load zone ×
      ingest run, with the zone's rooftop solar estimate. No tests: they would
      scan all of bronze (see header).
    columns:
      - name: interval_start_at
        description: Start of the five-minute interval (UTC).
      - name: load_zone
        description: ISO-NE load zone (ME, NH, VT, CT, RI, SEMA, WCMA, NEMA), as the weather uses.
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: isone_zonal_load__latest
    description: >
      The newest version of each zone's load in each five-minute interval,
      estimated and with rooftop solar added back. Incremental table (see model
      header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [interval_start_at, load_zone]
    columns:
      - name: interval_start_at
        description: Start of the five-minute interval (UTC).
        data_tests: [not_null]
      - name: load_zone
        description: ISO-NE load zone, as the weather uses.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ME, NH, VT, CT, RI, SEMA, WCMA, NEMA]
      - name: load_zone_id
        description: ISO-NE location ID of the zone (4001–4008).
      - name: load_mw
        description: Estimated load in the zone, MW (the zones add up to system native load).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 15000
      - name: btm_solar_mw
        description: Estimated behind-the-meter (rooftop) solar in the zone, MW; 0 after dark.
        data_tests:
          - accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
      - name: load_with_btm_solar_mw
        description: load_mw plus btm_solar_mw, MW; the demand weather drives.
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

  # ── ISO-NE: prices ──────────────────────────────────────────────────────────

  - name: isone_rt_lmp__base
    description: >
      Every ISO-NE real-time price at the Hub and eight load zones, one row per
      interval × location × version × ingest run. No tests: they would scan all
      of bronze (see header).
    columns:
      - name: interval_start_at
        description: Start of the five-minute interval (UTC).
      - name: location_code
        description: HUB, or the load zone (ME … NEMA).
      - name: is_final
        description: Whether this is ISO-NE's final price (else preliminary).
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: isone_rt_lmp__latest
    description: >
      The best real-time price per five-minute interval × location: final once
      published, preliminary until then. Incremental table (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [interval_start_at, location_code]
    columns:
      - name: interval_start_at
        description: Start of the five-minute interval (UTC).
        data_tests: [not_null]
      - name: location_code
        description: HUB, or the load zone (ME … NEMA).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [HUB, ME, NH, VT, CT, RI, SEMA, WCMA, NEMA]
      - name: location_id
        description: ISO-NE location ID (4000 the Hub, 4001–4008 the load zones).
      - name: lmp_usd_mwh
        description: Real-time locational marginal price, $/MWh (energy + congestion + losses).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -1000  # prices go negative when there's more power than load can use
                max_value: 10000  # scarcity pricing can reach thousands for minutes
      - name: energy_usd_mwh
        description: Energy component, $/MWh; the same at every location.
      - name: congestion_usd_mwh
        description: Congestion component, $/MWh; nonzero when transmission limits bind.
      - name: loss_usd_mwh
        description: Marginal loss component, $/MWh.
      - name: is_final
        description: Whether this is ISO-NE's final price (else preliminary, until the final arrives).
        data_tests: [not_null]
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

  - name: isone_da_lmp__base
    description: >
      Every ISO-NE day-ahead price at the Hub and eight load zones, one row per
      hour × location × ingest run. No tests: they would scan all of bronze (see
      header).
    columns:
      - name: hour_start_at
        description: Start of the hour the price is for (UTC).
      - name: location_code
        description: HUB, or the load zone (ME … NEMA).
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: isone_da_lmp__latest
    description: >
      The day-ahead price per hour × location: the market's expectation of the
      real-time price, set the day before. Incremental table (see model
      header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [hour_start_at, location_code]
    columns:
      - name: hour_start_at
        description: Start of the hour the price is for (UTC).
        data_tests: [not_null]
      - name: location_code
        description: HUB, or the load zone (ME … NEMA).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [HUB, ME, NH, VT, CT, RI, SEMA, WCMA, NEMA]
      - name: location_id
        description: ISO-NE location ID (4000 the Hub, 4001–4008 the load zones).
      - name: lmp_usd_mwh
        description: Day-ahead locational marginal price, $/MWh (energy + congestion + losses).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -1000
                max_value: 10000
      - name: energy_usd_mwh
        description: Energy component, $/MWh; the same at every location.
      - name: congestion_usd_mwh
        description: Congestion component, $/MWh.
      - name: loss_usd_mwh
        description: Marginal loss component, $/MWh.
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

  - name: isone_rt_lmp_hourly__base
    description: >
      Every backfilled hourly real-time price (2019–2024) at the Hub and eight
      load zones, one row per hour × location × ingest run. No tests: they
      would scan all of bronze (see header).
    columns:
      - name: hour_start_at
        description: Start of the hour the price is for (UTC).
      - name: location_code
        description: HUB, or the load zone (ME … NEMA).
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: isone_rt_lmp_hourly__latest
    description: >
      The final hourly real-time price per hour × location, 2019–2024, before
      the five-minute history. Incremental table (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [hour_start_at, location_code]
    columns:
      - name: hour_start_at
        description: Start of the hour the price is for (UTC).
        data_tests: [not_null]
      - name: location_code
        description: HUB, or the load zone (ME … NEMA).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [HUB, ME, NH, VT, CT, RI, SEMA, WCMA, NEMA]
      - name: location_id
        description: ISO-NE location ID (4000 the Hub, 4001–4008 the load zones).
      - name: lmp_usd_mwh
        description: Hourly real-time locational marginal price, $/MWh (the mean of the hour's five-minute prices).
        data_tests:
          - not_null
          - accepted_range:
              arguments:
                min_value: -1000
                max_value: 10000
      - name: energy_usd_mwh
        description: Energy component, $/MWh.
      - name: congestion_usd_mwh
        description: Congestion component, $/MWh.
      - name: loss_usd_mwh
        description: Marginal loss component, $/MWh.
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

  # ── EIA-930 ─────────────────────────────────────────────────────────────────

  - name: eia_region_data__base
    description: >
      Every EIA-930 hourly value for ISO New England (API 2019 on, bulk files
      2015–2018), one row per hour × measure × ingest run, labelled by hour
      start. No tests: they would scan all of bronze (see header).
    columns:
      - name: hour_start_at
        description: Start of the hour (UTC); EIA's own label is the hour's end.
      - name: measure
        description: D demand, DF day-ahead demand forecast, NG net generation, TI total interchange.
      - name: source
        description: api or bulk, the bronze table the row is from.
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: eia_region_data__latest
    description: >
      The newest EIA value per hour × measure for ISO New England, 2015-07 on.
      Incremental table (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [hour_start_at, measure]
    columns:
      - name: hour_start_at
        description: Start of the hour (UTC).
        data_tests: [not_null]
      - name: measure
        description: D demand, DF day-ahead demand forecast, NG net generation, TI total interchange.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [D, DF, NG, TI]
      - name: measure_name
        description: EIA's name for the measure.
      - name: value_mwh
        description: >
          Value for the hour, MWh (average MW over the hour); null when EIA has
          none. EIA's series has isolated one-hour glitches, kept as reported
          (e.g. interchange −12,307 at 2021-03-01 04:00 UTC between hours near
          −2,400); excluding them is for gold or a model to decide.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -10000  # interchange is negative when New England imports
                max_value: 40000
              config:
                severity: warn  # flags EIA's known glitches every run without blocking the build
      - name: source
        description: api (2019 on) or bulk (2015–2018).
        data_tests:
          - accepted_values:
              arguments:
                values: [api, bulk]
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

  - name: eia_region_data__by_hour
    description: >
      One row per hour for ISO New England: demand, ISO-NE's day-ahead demand
      forecast, net generation and interchange side by side. A view over
      eia_region_data__latest.
    columns:
      - name: hour_start_at
        description: Start of the hour (UTC).
      - name: demand_mwh
        description: Demand, MWh.
      - name: demand_forecast_mwh
        description: ISO-NE's day-ahead demand forecast for the hour, MWh.
      - name: net_generation_mwh
        description: Net generation in New England, MWh.
      - name: interchange_mwh
        description: Total interchange, MWh; negative when New England imported.
      - name: source
        description: api or bulk.

  - name: eia_fuel_type_data__base
    description: >
      Every EIA-930 hourly net generation value by fuel for ISO New England,
      2019 on, one row per hour × fuel × ingest run, labelled by hour start. No
      tests: they would scan all of bronze (see header).
    columns:
      - name: hour_start_at
        description: Start of the hour (UTC); EIA's own label is the hour's end.
      - name: fuel
        description: EIA fuel code (COL, NG, NUC, OIL, WAT, PS, SUN, SNB, WND, BAT, OTH).
      - name: ingested_at
        description: The ingest run that saw this version (UTC).

  - name: eia_fuel_type_data__latest
    description: >
      The newest EIA value per hour × fuel for ISO New England, 2019 on.
      Incremental table (see model header).
    data_tests:
      - unique_combination:
          arguments:
            columns: [hour_start_at, fuel]
    columns:
      - name: hour_start_at
        description: Start of the hour (UTC).
        data_tests: [not_null]
      - name: fuel
        description: EIA fuel code.
        data_tests: [not_null]
      - name: fuel_name
        description: EIA's name for the fuel, e.g. Natural Gas.
      - name: generation_mwh
        description: Net generation from the fuel for the hour, MWh; storage can be negative while charging.
        data_tests:
          - accepted_range:
              arguments:
                min_value: -5000
                max_value: 30000
      - name: ingested_at
        description: The ingest run this version came from (UTC).
        data_tests: [not_null]

# ══════════════════════════════════════════════════════════════════════════════
# Unit tests — fixed input rows → expected output, for rules a data test can't
# see in a day's real data. Run inside `dbt build` on inline rows (no bronze
# scan). Incremental models are tested as a first build (is_incremental false).
# ══════════════════════════════════════════════════════════════════════════════

unit_tests:
  - name: isone_rt_lmp__latest_prefers_final_over_newer_prelim
    description: >
      A final price wins over a preliminary one for the same interval, even when
      the preliminary one was ingested later (decision 0012); with only
      preliminary versions, the newest wins.
    model: isone_rt_lmp__latest
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('isone_rt_lmp__base')
        rows:
          # Hub 12:00: final, then a later preliminary copy → final kept
          - {interval_start_at: "2026-10-30 16:00:00", location_code: HUB, location_id: 4000, lmp_usd_mwh: 31.0, is_final: true,  ingested_at: "2026-11-01 00:10:00"}
          - {interval_start_at: "2026-10-30 16:00:00", location_code: HUB, location_id: 4000, lmp_usd_mwh: 30.0, is_final: false, ingested_at: "2026-11-01 06:10:00"}
          # Maine 12:00: two preliminary versions → newest kept
          - {interval_start_at: "2026-10-30 16:00:00", location_code: ME,  location_id: 4001, lmp_usd_mwh: 28.0, is_final: false, ingested_at: "2026-10-31 18:10:00"}
          - {interval_start_at: "2026-10-30 16:00:00", location_code: ME,  location_id: 4001, lmp_usd_mwh: 29.0, is_final: false, ingested_at: "2026-11-01 00:10:00"}
    expect:
      rows:
        - {interval_start_at: "2026-10-30 16:00:00", location_code: HUB, lmp_usd_mwh: 31.0, is_final: true}
        - {interval_start_at: "2026-10-30 16:00:00", location_code: ME,  lmp_usd_mwh: 29.0, is_final: false}
