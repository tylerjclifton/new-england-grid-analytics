version: 2

# ══════════════════════════════════════════════════════════════════════════════
# Seeds — reference data kept in the repo, loaded into silver by `dbt build`
# ══════════════════════════════════════════════════════════════════════════════

seeds:
  - name: isone_pricing_locations
    description: >
      The ISO-NE locations this project tracks (decision 0012): the Hub and the
      eight load zones, by ISO-NE location ID. Maps the IDs in the price and
      zonal load feeds to the load zone codes the weather uses (ME … NEMA,
      decision 0009). Grain: one row per location.
    config:
      column_types:
        location_id: INT64
    columns:
      - name: location_id
        description: ISO-NE location ID (LocId in the price feeds, load_zone_id in zonal load).
        data_tests: [unique, not_null]
      - name: location_code
        description: Project code; HUB, or the load zone (ME, NH, VT, CT, RI, SEMA, WCMA, NEMA).
        data_tests: [unique, not_null]
      - name: iso_location_name
        description: ISO-NE's name for the location.
      - name: description
        description: Plain-language name.

  - name: us_holidays
    description: >
      US holidays that move electricity demand, by Eastern date, 2015–2035
      (decision 0016), generated by scripts/generate-holidays.py from rules.
      Two lists: NERC's six off-peak holidays (the grid runs them like
      Sundays) and the federal holidays as observed. Grain: one row per date
      on either list.
    config:
      column_types:
        holiday_date: DATE
        is_nerc_holiday: BOOL
        is_federal_holiday: BOOL
    columns:
      - name: holiday_date
        description: The Eastern date of the holiday (as observed).
        data_tests: [unique, not_null]
      - name: holiday_name
        description: The holiday's name; NERC's name where a date is on both lists.
        data_tests: [not_null]
      - name: is_nerc_holiday
        description: One of NERC's six (New Year's, Memorial Day, Independence Day, Labor Day, Thanksgiving, Christmas); Sunday moves to Monday, Saturday stays.
      - name: is_federal_holiday
        description: A federal holiday as observed (Saturday → Friday, Sunday → Monday).
